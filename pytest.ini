[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# --- Асинхронные тесты ---
asyncio_mode = auto

# --- Базовые опции ---
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    --durations=10

# --- Маркеры ---
markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
    gui: marks tests as GUI tests
    security: marks tests as security tests
    performance: marks tests as performance tests
    bitrix: marks tests that require Bitrix24 webhook
    network: marks tests that require network access
    filesystem: marks tests that touch the real filesystem

# --- Предупреждения ---
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    default:::src.*

# --- Покрытие ---
# Включается флагом --cov=src. По умолчанию выключено,
# чтобы обычные прогоны не тормозили.